[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-animate-mcp"
version = "0.1.0"
description = "MCP server + Blender add-on for AI-driven motion: easing, springs, bezier paths and x/v/a/jerk analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
blender-animate-mcp = "blender_animate_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blender_animate_mcp = ["guide.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
